name = "infinity-grid"
main = "worker.js"
compatibility_date = "2025-06-01"

# The web build (prepared by tools/publish_online.ps1). Files that exist are
# served directly; everything else (/play, /index.wasm) reaches worker.js.
[assets]
directory = "../../build/online_site"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# One Durable Object per player account: name, credits and owned cosmetics.
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Account"]

# Player logins: e-mail + password and Google (see auth.js).
[[durable_objects.bindings]]
name = "LOGINS"
class_name = "Login"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Login"]

# Ranked queue, ratings and leaderboard (see ranked.js).
[[durable_objects.bindings]]
name = "RANKED"
class_name = "RankedLobby"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RankedLobby"]

# Credit packs paid through Stripe Checkout (see payments.js). Empty price ids
# switch the packs off. STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are secrets
# and are set with `npx wrangler secret put <NAME>`, never written here.
[vars]
STRIPE_PRICE_SMALL = "price_1UTywbChrUtwv0Dvr8ZrWEkS"
STRIPE_PRICE_MEDIUM = "price_1UTyxQChrUtwv0DvsQOYT46A"
STRIPE_PRICE_LARGE = "price_1UTyyBChrUtwv0DvtJAfPohy"
# Google sign-in: OAuth client id (public); GOOGLE_CLIENT_SECRET is a secret.
GOOGLE_CLIENT_ID = "421002041560-4tlnqeir7dvq0ipgcflhnh6kaej7i6tu.apps.googleusercontent.com"
